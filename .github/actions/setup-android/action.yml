name: Setup Android environment
description: Configure the JDK and Gradle cache used by Dambom workflows

inputs:
  cache-read-only:
    description: Prevent this job from writing a new Gradle cache entry
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x gradlew

name: Baseline Profile Maintenance

on:
  push:
    branches:
      - develop
    paths:
      - "**/src/**"
      - "**/*.gradle.kts"
      - "**/proguard*.pro"
      - "**/consumer-rules.pro"
      - "gradle/**"
      - gradle.properties
      - gradlew
      - "build-logic/**"
      - .github/actions/setup-android/action.yml
      - .github/workflows/baseline-profile.yml
      - "!app/src/release/generated/baselineProfiles/**"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profile-develop
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Baseline Profile
    if: ${{ github.repository == 'comst19/Dambom' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check out develop
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
          fetch-depth: 0

      - name: Record generation source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Android environment
        uses: ./.github/actions/setup-android
        with:
          cache-read-only: "false"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Generate release Baseline Profile
        run: >-
          ./gradlew
          :app:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          --stacktrace

      - name: Upload generated profiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseline-profile-${{ github.run_id }}
          path: app/src/release/generated/baselineProfiles/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Open Baseline Profile PR
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Check out develop
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Check whether generation inputs are still current
        id: current
        env:
          SOURCE_SHA: ${{ needs.generate.outputs.source-sha }}
        run: |
          if git diff --quiet "$SOURCE_SHA" HEAD -- \
            ':(glob)**/src/**' ':(glob)**/*.gradle.kts' \
            ':(glob)**/proguard*.pro' ':(glob)**/consumer-rules.pro' \
            ':(glob)gradle/**' gradle.properties gradlew \
            ':(glob)build-logic/**' .github/actions/setup-android/action.yml \
            .github/workflows/baseline-profile.yml \
            ':(exclude)app/src/release/generated/baselineProfiles/**' \
            ':(exclude,glob)**/*.md'; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matches=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download generated profiles
        if: ${{ steps.current.outputs.matches == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baseline-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/generated-profiles

      - name: Apply generated profiles
        if: ${{ steps.current.outputs.matches == 'true' }}
        run: rsync -a --delete "$RUNNER_TEMP/generated-profiles/" app/src/release/generated/baselineProfiles/

      - name: Create or update the maintenance PR
        if: ${{ steps.current.outputs.matches == 'true' }}
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: develop
          branch: chore/baseline-profile
          add-paths: app/src/release/generated/baselineProfiles/
          commit-message: "chore: Baseline Profile 자동 갱신 [skip ci]"
          title: "chore: Baseline Profile 자동 갱신 [skip ci]"
          body: |
            develop의 핵심 사용자 경로를 관리형 기기에서 실행해 Baseline Profile과 Startup Profile을 갱신합니다.

            생성 기준: ${{ needs.generate.outputs.source-sha }}
            자동 이벤트는 [skip ci]로 생략하고 Android CI만 별도로 실행합니다.
            Quality gate 통과 후 Squash merge합니다. 병합 커밋에도 [skip ci]를 유지합니다.

      - name: Run the required PR checks explicitly
        if: ${{ steps.pull-request.outputs.pull-request-number != '' && steps.pull-request.outputs.pull-request-operation != 'closed' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-ci.yml --ref chore/baseline-profile -f target_branch=develop

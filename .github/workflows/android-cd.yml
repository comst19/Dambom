name: Android CD

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      from_ref:
        description: Previous tag or commit used as the release notes starting point
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Android environment
        uses: ./.github/actions/setup-android
        with:
          cache-read-only: "false"

      - name: Set release keystore path
        shell: bash
        run: echo "DAMBOM_RELEASE_STORE_FILE=$RUNNER_TEMP/dambom-release.jks" >> "$GITHUB_ENV"

      - name: Generate release notes draft
        env:
          RELEASE_NOTES_FROM_REF: ${{ inputs.from_ref }}
          RELEASE_EVENT_BEFORE: ${{ github.event.before }}
        run: .github/scripts/generate-release-notes.sh "$RUNNER_TEMP/release-notes.txt"

      - name: Validate signing secrets
        shell: bash
        env:
          DAMBOM_KEYSTORE_BASE64: ${{ secrets.DAMBOM_KEYSTORE_BASE64 }}
          DAMBOM_RELEASE_STORE_PASSWORD: ${{ secrets.DAMBOM_RELEASE_STORE_PASSWORD }}
          DAMBOM_RELEASE_KEY_ALIAS: ${{ secrets.DAMBOM_RELEASE_KEY_ALIAS }}
          DAMBOM_RELEASE_KEY_PASSWORD: ${{ secrets.DAMBOM_RELEASE_KEY_PASSWORD }}
        run: |
          required=(
            DAMBOM_KEYSTORE_BASE64
            DAMBOM_RELEASE_STORE_PASSWORD
            DAMBOM_RELEASE_KEY_ALIAS
            DAMBOM_RELEASE_KEY_PASSWORD
          )
          missing=()
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          DAMBOM_KEYSTORE_BASE64: ${{ secrets.DAMBOM_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DAMBOM_KEYSTORE_BASE64" | base64 --decode > "$DAMBOM_RELEASE_STORE_FILE"
          chmod 600 "$DAMBOM_RELEASE_STORE_FILE"

      - name: Run release gate and build APK and AAB
        env:
          DAMBOM_RELEASE_STORE_PASSWORD: ${{ secrets.DAMBOM_RELEASE_STORE_PASSWORD }}
          DAMBOM_RELEASE_KEY_ALIAS: ${{ secrets.DAMBOM_RELEASE_KEY_ALIAS }}
          DAMBOM_RELEASE_KEY_PASSWORD: ${{ secrets.DAMBOM_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          ktlintCheck
          detekt
          testDebugUnitTest
          lintRelease
          :app:assembleRelease
          :app:bundleRelease
          --parallel
          --stacktrace

      - name: Verify signed AAB
        shell: bash
        env:
          DAMBOM_RELEASE_STORE_PASSWORD: ${{ secrets.DAMBOM_RELEASE_STORE_PASSWORD }}
          DAMBOM_RELEASE_KEY_ALIAS: ${{ secrets.DAMBOM_RELEASE_KEY_ALIAS }}
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'
          jarsigner -verify -strict -certs \
            -keystore "$DAMBOM_RELEASE_STORE_FILE" \
            -storepass:env DAMBOM_RELEASE_STORE_PASSWORD \
            app/build/outputs/bundle/release/app-release.aab \
            "$DAMBOM_RELEASE_KEY_ALIAS" \
            | tee "$RUNNER_TEMP/jarsigner.log"
          grep -q 'jar verified.' "$RUNNER_TEMP/jarsigner.log"
          if grep -q 'jar is unsigned' "$RUNNER_TEMP/jarsigner.log"; then
            echo '::error::Release AAB is unsigned.'
            exit 1
          fi

      - name: Verify signed APK
        shell: bash
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_sdk_root" ]]; then
            echo '::error::Android SDK path is unavailable.'
            exit 1
          fi
          apksigner_path=$(find "$android_sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [[ -z "$apksigner_path" ]]; then
            echo '::error::apksigner is unavailable.'
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk_path"

      - name: Upload release APK, AAB, and R8 metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dambom-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/usage.txt
            ${{ runner.temp }}/release-notes.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$DAMBOM_RELEASE_STORE_FILE"

name: QA APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Android environment
        uses: ./.github/actions/setup-android
        with:
          cache-read-only: "false"

      - name: Run QA gate and build APK
        run: >-
          ./gradlew
          ktlintCheck
          detekt
          testDebugUnitTest
          lintQa
          :app:assembleQa
          --parallel
          --stacktrace

      - name: Verify signed QA APK
        shell: bash
        run: |
          apk_path="app/build/outputs/apk/qa/app-qa.apk"
          test -s "$apk_path"
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_sdk_root" ]]; then
            echo '::error::Android SDK path is unavailable.'
            exit 1
          fi
          apksigner_path=$(find "$android_sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [[ -z "$apksigner_path" ]]; then
            echo '::error::apksigner is unavailable.'
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk_path"

      - name: Upload QA APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dambom-qa-${{ github.sha }}
          path: app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 14
